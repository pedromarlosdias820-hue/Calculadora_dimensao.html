<script>
    let dimensao1 = prompt("Digite a dimensão 1 do paralelepípedo: ");
    let dimensao2 = prompt("Digite a dimensão 2 do paralelepípedo: ");
    let dimensao3 = prompt("Digite a dimensão 3 do paralelepípedo: ");

    dimensao1 = parseFloat(dimensao1);
    dimensao2 = parseFloat(dimensao2);
    dimensao3 = parseFloat(dimensao3);

    let volume = dimensao1 * dimensao2 * dimensao3;

    alert(" O volume do paralelepípedo e: " + volume );
</script>
